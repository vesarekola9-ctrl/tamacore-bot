name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check template exists
        id: tpl
        shell: bash
        run: |
          if [ -f "templates/gdevelop_template/game.json" ]; then
            echo "has_template=true" >> $GITHUB_OUTPUT
            echo "Template OK"
          else
            echo "has_template=false" >> $GITHUB_OUTPUT
            echo "Template missing: commit templates/gdevelop_template/game.json"
          fi

      - name: Build CI game
        if: steps.tpl.outputs.has_template == 'true'
        run: |
          python run_pipeline.py --assets-dir assets --template-dir templates/gdevelop_template --game-dir _ci_game

      - name: Upload artifact
        if: steps.tpl.outputs.has_template == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-gdevelop-game
          path: |
            _ci_game/game.json
            _ci_game/assets/generated/*

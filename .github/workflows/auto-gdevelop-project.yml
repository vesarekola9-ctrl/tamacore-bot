name: Automatic GDevelop project package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'templates/**'
      - 'specs/**'
      - 'pyproject.toml'
      - '.github/workflows/auto-gdevelop-project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TamaCore factory
        run: python -m pip install -e .
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate GDevelop source project and browser preview
        run: |
          python -m tamacore.cli ai-make-game --out-pack build/ai_pack --template templates/gdevelop_template --out-game build/gdevelop_game --export-out build/exports --bundle-out build/release_bundle --shop-count 5 --foods 5 --cosmetics 5 --with-demo-layout
      - name: Verify generated project exists
        run: |
          test -s build/gdevelop_game/game.json
          test -s build/gdevelop_game/PLAY_GAME.html
          test -s build/gdevelop_game/PET_ANIMATION_MANIFEST.json
          test -s build/gdevelop_game/assets/generated/player/player_idle_01.png
          test -s build/gdevelop_game/assets/generated/player/player_walk_01.png
          test -s build/gdevelop_game/assets/generated/player/player_sleep_01.png
          python -m json.tool build/gdevelop_game/game.json > /dev/null
          python -m json.tool build/gdevelop_game/PET_ANIMATION_MANIFEST.json > /dev/null
      - name: Verify pet animation events are present in generated GDevelop project
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path("build/gdevelop_game/game.json").read_text(encoding="utf-8"))
          scenes = project.get("layouts", [])
          events = [event for scene in scenes for event in scene.get("events", []) if isinstance(event, dict)]
          for name in ("Idle", "Walk", "Sleep", "Eat", "Play"):
              assert any(event.get("name") == f"TamaCorePetAnimation_{name}" for event in events), name
          print("Five pet animation events found in GDevelop project")
          PY
      - name: Audit GDevelop scenes, resources and animation frames
        run: |
          python -m tamacore.factory_v3_1.gdevelop_audit build/gdevelop_game/game.json > build/GDEVELOP_AUDIT.txt 2>&1 || {
            cat build/GDEVELOP_AUDIT.txt
            echo "::warning::Generated GDevelop project needs review; see GDEVELOP_AUDIT.txt"
          }
      - name: Upload GDevelop project and preview
        uses: actions/upload-artifact@v4
        with:
          name: TamaCore-GDevelop-project-${{ github.run_number }}
          path: |
            build/gdevelop_game/
            build/ai_pack/
            build/GDEVELOP_AUDIT.txt
            build/release_bundle/
          if-no-files-found: error
          retention-days: 30

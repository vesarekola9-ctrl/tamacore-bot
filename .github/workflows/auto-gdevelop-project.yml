name: Automatic GDevelop project package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'templates/**'
      - 'specs/**'
      - 'pyproject.toml'
      - '.github/workflows/auto-gdevelop-project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TamaCore factory
        run: python -m pip install -e .
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate GDevelop source project and browser preview
        run: |
          python -m tamacore.cli ai-make-game \\
            --out-pack build/ai_pack \\
            --template templates/gdevelop_template \\
            --out-game build/gdevelop_game \\
            --export-out build/exports \\
            --bundle-out build/release_bundle \\
            --shop-count 5 --foods 5 --cosmetics 5 --with-demo-layout
      - name: Verify generated project exists
        run: |
          test -s build/gdevelop_game/game.json
          test -s build/gdevelop_game/PLAY_GAME.html
          python -m json.tool build/gdevelop_game/game.json > /dev/null
      - name: Upload GDevelop project and preview
        uses: actions/upload-artifact@v4
        with:
          name: TamaCore-GDevelop-project-${{ github.run_number }}
          path: |
            build/gdevelop_game/
            build/ai_pack/
            build/release_bundle/
          if-no-files-found: error
          retention-days: 30

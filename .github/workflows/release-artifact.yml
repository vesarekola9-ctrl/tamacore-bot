name: Demo Build Artifact

on:
  workflow_dispatch:

jobs:
  package-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Make demo
        run: |
          python -m tamacore.cli make-game --v31 --v32 --pack assets/packs/demo_pack --template templates/gdevelop_template --out demo_game --with-demo-layout --export-out exports --export-web --export-zip --export-android --bundle-release --bundle-out release_bundle

      - name: Validate build
        run: |
          python -m tamacore.cli validate --game-dir demo_game

      - name: Validate exports
        run: |
          python -m tamacore.cli validate-exports --export-dir exports

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamacore-demo-game
          path: demo_game

      - name: Upload exports artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamacore-demo-exports
          path: exports

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamacore-release-bundle
          path: |
            release_bundle
            release_bundle.zip

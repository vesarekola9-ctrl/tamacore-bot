name: Demo Build Artifact

on:
  workflow_dispatch:

jobs:
  package-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Inspect pack
        run: |
          python -m tamacore.cli inspect-pack --pack assets/packs/demo_pack

      - name: Build demo
        run: |
          python -m tamacore.cli build --v31 --v32 --pack assets/packs/demo_pack --template templates/gdevelop_template --out demo_game --with-demo-layout

      - name: Validate demo
        run: |
          python -m tamacore.cli validate --game-dir demo_game

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamacore-demo-game
          path: demo_game

name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Inspect demo pack
        run: |
          python -m tamacore.cli inspect-pack --pack assets/packs/demo_pack

      - name: Build demo game
        run: |
          python -m tamacore.cli build --v31 --v32 --pack assets/packs/demo_pack --template templates/gdevelop_template --out demo_game --with-demo-layout

      - name: Validate outputs
        run: |
          python -m tamacore.cli validate --game-dir demo_game

      - name: Run integration test
        run: |
          python test_build.py

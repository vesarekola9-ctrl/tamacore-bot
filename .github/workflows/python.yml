name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Inspect demo pack
        run: |
          python -m tamacore.cli inspect-pack --pack assets/packs/demo_pack

      - name: Make demo game
        run: |
          python -m tamacore.cli make-game --v31 --v32 --pack assets/packs/demo_pack --template templates/gdevelop_template --out demo_game --with-demo-layout --export-out exports --export-web --export-zip --bundle-release --bundle-out release_bundle

      - name: Validate build
        run: |
          python -m tamacore.cli validate --game-dir demo_game

      - name: Validate exports
        run: |
          python -m tamacore.cli validate-exports --export-dir exports

      - name: Check release bundle
        run: |
          test -d release_bundle
          test -f release_bundle.zip
          test -f release_bundle/README_RELEASE.txt

      - name: Run integration test
        run: |
          python test_build.py

name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build demo game
        run: |
          tamacore build --v31 --v32 --pack assets/packs/demo_pack --out demo_game --with-demo-layout

      - name: Verify outputs
        run: |
          test -f demo_game/game.json
          test -f demo_game/catalog.json
          test -f demo_game/levels.json
          test -f demo_game/shop.json
          test -f demo_game/FACTORY_MANIFEST.json
